services:
  postgres:
    image: postgres:17
    container_name: medicalscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicalscoped_dev
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - medicalscout-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d medicalscoped_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medicalscout-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medicalscout-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - medicalscout-pgadmin:/var/lib/pgadmin
    networks:
      - medicalscout-net

volumes:
  medicalscout-pgdata:
  medicalscout-pgadmin:

networks:
  medicalscout-net:
    driver: bridge